spring.application.name=jwe-keycloak
server.port=${SERVER_PORT:8081}
spring.threads.virtual.enabled=true

# JSON: Keycloak token responses use snake_case (access_token, expires_in, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Keycloak integration (all values come from environment variables; secrets default to empty)
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:demo}
keycloak.m2m.client-id=${KEYCLOAK_M2M_CLIENT_ID:m2m-client}
keycloak.m2m.client-secret=${KEYCLOAK_M2M_CLIENT_SECRET:}
keycloak.login.client-id=${KEYCLOAK_LOGIN_CLIENT_ID:login-client}
keycloak.login.client-secret=${KEYCLOAK_LOGIN_CLIENT_SECRET:}
